name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Repeat CPU cancellation and background result tests
        shell: bash
        run: |
          for attempt in 1 2 3; do
            cargo test -p torse-runtime --lib --locked
            cargo test -p torse-client scene::background::tests --locked
            cargo test -p torse-server --test parallel_planning --locked
            cargo test -p torse-server --test drop_planning --locked
            cargo test -p torse-server --test runtime_commit --locked
            cargo test -p torse-server --test prevalidation --locked
            cargo test -p torse-server --test component_prevalidation --locked
            cargo test -p torse-server --test projection --locked
            cargo test -p torse-sim --test replica --locked
          done
      - name: Repeat checkpoint concurrency tests
        if: runner.os == 'Linux'
        run: |
          for attempt in {1..10}; do
            echo "Checkpoint concurrency iteration $attempt"
            cargo test -p torse-storage --test checkpoint
          done
      - name: Content fixture
        run: cargo run -p torse-tools -- content-fixture
      - name: M1 scenario
        run: cargo run -p torse-tools -- m1-scenario
      - name: Commit arbitration scenario
        run: cargo run -p torse-tools -- commit-scenario
      - name: Tick scenario
        run: cargo run -p torse-tools -- tick-scenario
      - name: Exchange scenario
        run: cargo run -p torse-tools -- exchange-scenario
      - name: Recovery scenario
        run: cargo run -p torse-tools -- recovery-scenario
      - name: Persistence scenario
        run: cargo run -p torse-tools -- persistence-scenario
      - name: Durable execution server smoke
        run: cargo run -p torse-server -- .work/ci-execution-world --listen 127.0.0.1:0 --ticks 2 --planning-workers 4 --prevalidate-workers 4 --prevalidate-components
      - name: Serial baseline smoke
        run: cargo run -p torse-server --example serial_baseline -- --output .work/ci-serial-baseline --ticks 2 --warmup 1 --batch 16
      - name: Native item body baseline smoke
        run: cargo run -p torse-server --example drop_baseline --locked -- --output .work/ci-drop-baseline --ticks 2 --warmup 1

  mods:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install guest target
        run: rustup target add wasm32-unknown-unknown
      - name: Mod host and server Clippy
        run: cargo clippy -p torse-mod-host --features package -p torse-server --features mods --all-targets --locked -- -D warnings
      - name: Mod host tests
        run: cargo test -p torse-mod-host --features package --all-targets --locked
      - name: Server with mods
        run: cargo test -p torse-server --features mods --all-targets --locked
      - name: Repeat real multi-machine durability
        shell: bash
        run: |
          for attempt in 1 2 3; do
            cargo test -p torse-server --features mods --test multi_machine --locked
          done
      - name: Real multi-machine benchmark smoke
        run: cargo run -p torse-server --features mods --example multi_machine --locked -- .work/ci-multi-machine --machines 8 --subscribers 2 --ticks 2 --warmup 1 --workers 4 --file

  experiments:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - name: Check optional experiments
        run: cargo check -p torse-tools --features experiments --all-targets
      - name: Check client
        run: cargo check -p torse-client --all-targets
      - name: Test runtime probes
        run: |
          cargo test -p torse-runtime --features ecs-probe
          cargo test -p torse-mod-host --features wasm-probe
