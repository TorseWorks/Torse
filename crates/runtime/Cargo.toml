[package]
name = "torse-runtime"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
ecs-probe = ["dep:bevy_ecs", "dep:bevy_tasks"]

[dependencies]
torse-types = { path = "../types" }
bevy_ecs = { version = "=0.18.1", features = ["multi_threaded"], optional = true }
bevy_tasks = { version = "=0.18.1", features = ["multi_threaded"], optional = true }
