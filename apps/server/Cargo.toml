[package]
name = "torse-server"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
mods = ["torse-mod-host/package"]

[dependencies]
torse-diagnostics = { path = "../../crates/diagnostics" }
torse-runtime = { path = "../../crates/runtime" }
crc32c = "=0.6.8"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
torse-codec = { path = "../../crates/codec" }
torse-storage = { path = "../../crates/storage" }
torse-types = { path = "../../crates/types" }
torse-sim = { path = "../../crates/sim" }
torse-world = { path = "../../crates/world" }
torse-protocol = { path = "../../crates/protocol" }
torse-net = { path = "../../crates/net" }

torse-content = { path = "../../crates/content" }
torse-modules = { path = "../../crates/modules" }
torse-inventory = { path = "../../modules/inventory" }
torse-items = { path = "../../modules/items" }
torse-mod-host = { path = "../../crates/mod_host", optional = true }

[dev-dependencies]
torse-mod-api = { path = "../../crates/mod_api" }

[[example]]
name = "mod_baseline"
required-features = ["mods"]

[[example]]
name = "multi_machine"
required-features = ["mods"]
