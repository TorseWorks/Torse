[workspace]
members = [
    "apps/client",
    "apps/server",
    "apps/tools",
    "crates/types",
    "crates/runtime",
    "crates/content",
    "crates/world",
    "crates/sim",
    "crates/actions",
    "crates/modules",
    "crates/world_services",
    "crates/mod_api",
    "crates/mod_host",
    "crates/mod_sdk",
    "examples/mods/roundtrip",
    "examples/mods/machine",
    "crates/codec",
    "crates/storage",
    "crates/protocol",
    "crates/net",
    "crates/render",
    "crates/assets",
    "crates/diagnostics",
    "modules/inventory",
    "modules/crafting",
    "modules/energy",
    "modules/ui",
    "modules/items",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"

# Keep large native TLS/Wasm links within Windows PDB type-record limits.
# Interactive development keeps diagnostics while optimizing hot loops.
[profile.dev]
debug = "limited"
opt-level = 1
debug-assertions = true
overflow-checks = true

# Keep test builds fast and exercise fully unoptimized code as well.
[profile.test]
opt-level = 0

# Use when source-level stepping needs the original instruction order.
[profile.debug-unoptimized]
inherits = "dev"
opt-level = 0
